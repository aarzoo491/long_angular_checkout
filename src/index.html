<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LongAngular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>
        (function () {
            const visi_wid = 1040;
            const visi_flicker = 4000;
            const visi_flicker_ele = "html";
            let lastLoadedPath = "";
            let loadLock = false;
            function addFlickerCSS() {
                if (document.getElementById("visi_flicker")) return;
                const st = document.createElement("style");
                st.id = "visi_flicker";
                st.type = "text/css";
                st.appendChild(
                    document.createTextNode(
                        `${visi_flicker_ele}{opacity:0!important;background:none!important;}`
                    )
                );
                document.head.appendChild(st);
                setTimeout(removeFlicker, visi_flicker);
            }
            function removeFlicker() {
                const f = document.getElementById("visi_flicker");
                if (f) f.remove();
            }
            function resetVisiGlobals() {
                delete window.visiopt_code;
                delete window.visiopt_code_status;
                delete window.VisiOptSDK;
                delete window.VisiVariationEngine;
                delete window.VisiHeatmapEngine;
                delete window.VisiScrollmapEngine;
                delete window.VisiRecordingEngine;
                delete window.VisiEmEngine;
                delete window.VisioptConfig;
                window._kx_called = false;
                window._kx_tid = 0;
                window.pageJson = null;
                window.visi_rot_sts = 0;
            }
            function loadVTOnce() {
                const current = location.pathname;
                if (current === lastLoadedPath) return;
                lastLoadedPath = current;
                if (loadLock) return;
                loadLock = true;
                setTimeout(() => loadLock = false, 300);
                resetVisiGlobals();
                const old = document.getElementById("visi_dynamic_js");
                if (old) old.remove();
                const s = document.createElement("script");
                s.id = "visi_dynamic_js";
                s.src = "https://visioptdev.com/client/js_test/vt." + visi_wid + "_1.js";
                s.async = true;
                document.head.appendChild(s);
            }
            let lastPath = location.pathname;
            function watchUrlChanges(callback) {
                setInterval(() => {
                    const current = location.pathname;
                    if (current !== lastPath) {
                        lastPath = current;
                        console.log("Route changed →", current);
                        callback();
                    }
                }, 50);
            }
            watchUrlChanges(() => {
                waitForAppHome(loadVTOnce);
            });
            function waitForAppHome(cb) {
                if (!waitForAppHome.hasRun) {
                    waitForAppHome.hasRun = true;
                    let tries = 0;
                    const t = setInterval(() => {
                        tries++;
                        const home = document.querySelector("app-home");
                        if (home) {
                            clearInterval(t);
                            cb();
                            return;
                        }
                        if (tries >= 60) {
                            clearInterval(t);
                            const t2 = setInterval(() => {
                                const nodes = document.querySelectorAll("*");
                                for (const el of nodes) {
                                    if (el.tagName && el.tagName.startsWith("APP-")) {
                                        clearInterval(t2);
                                        cb();
                                        return;
                                    }
                                }
                            }, 40);
                        }
                    }, 40);
                } else {
                    const t = setInterval(() => {
                        const nodes = document.querySelectorAll('*');
                        for (const el of nodes) {
                            if (el.tagName && el.tagName.startsWith("APP-")) {
                                clearInterval(t);
                                cb();
                                return;
                            }
                        }
                    }, 40);
                }
            }

            function waitForAngularRoot(cb) {
                const t = setInterval(() => {
                    if (document.body && document.querySelector("app-root")) {
                        clearInterval(t);
                        cb();
                    }
                }, 30);
            }
            waitForAngularRoot(() => {
                addFlickerCSS();
                waitForAppHome(loadVTOnce);
            });

        })();
    </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
