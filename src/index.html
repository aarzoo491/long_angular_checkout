<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LongAngular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script type="text/javascript">
    window.visiopt_code = window.visiopt_code || (function () {
      var visi_wid = 1040,
          visi_flicker_time = 4000,
          visi_flicker_element = 'html',
          c = false,
          d = document,
          visi_fn = {
            begin: function () {
              var a = d.getElementById('visi_flicker');
              if (!a) {
                a = d.createElement('style');
                var b = visi_flicker_element
                  ? visi_flicker_element + '{opacity:0!important;background:none!important;}'
                  : '';
                a.id = 'visi_flicker';
                a.type = 'text/css';
                a.appendChild(d.createTextNode(b));
                d.head.appendChild(a);
              }
            },
            complete: function () {
              c = true;
              var a = d.getElementById('visi_flicker');
              if (a && a.parentNode) a.parentNode.removeChild(a);
            },
            completed: function () {
              return c;
            },
            pack: function (url) {
              var s = d.createElement('script');
              s.src = url;
              s.type = 'text/javascript';
              s.onerror = function () {
                visi_fn.complete();
              };
              d.head.appendChild(s);
            },
            init: function () {
              visi_fn.begin();
              setTimeout(function () {
                visi_fn.complete();
              }, visi_flicker_time);
              this.pack('https://visioptdev.com/client/js_test/vt.' + visi_wid + '.js');
              return true;
            }
          };
      window.visiopt_code_status = visi_fn.init();
      return visi_fn;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
